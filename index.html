    <script>
      // Defensive fix for Chrome extensions attempting to intercept window.fetch
      (function() {
        try {
          var origFetch = window.fetch;
          var currentFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return currentFetch; },
            set: function(val) { currentFetch = val; }
          });
        } catch (e) {
          // Ignore if cannot redefine
        }
      })();
    </script>
